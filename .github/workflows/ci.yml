name: CI

# This repository has no automatic deploy: code goes to the host by hand, and only code whose CI is green.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job can only read the repository unless it says otherwise.
permissions:
  contents: read

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # DEP-04: a high or critical advisory outside security/audit-allowlist.json fails the run.
      - name: Dependency audit
        run: node scripts/ci/audit.js

      # DEP-12: every action pinned to a commit sha, every workflow with explicit permissions.
      - name: Workflows pinned
        run: node scripts/ci/pinned-actions.js

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # SCN-04: the whole history is searched for leaked secrets. The binary has a fixed version and checksum.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 --no-banner --config .gitleaks.toml .

  # SCN-08: static security analysis with pinned Semgrep rules (scripts/ci/semgrep.sh).
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==1.185.0

      - name: Scan
        run: scripts/ci/semgrep.sh

