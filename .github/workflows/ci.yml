name: CI

# Type check, tests and build only. The app is paused, so there is no deploy step.
on:
  push:
  pull_request:

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build
