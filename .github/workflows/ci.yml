name: CI

# Type check, tests and build only. The app is paused, so there is no deploy step.
on:
  push:
    branches: [main]

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway MariaDB for the replication tests (same line as the backend's CI).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SRC_DB_HOST: 127.0.0.1
      SRC_DB_PORT: 3306
      SRC_DB_USER: root
      SRC_DB_PASSWORD: ''
      SRC_DB_NAME: dup_src
      DST_DB_HOST: 127.0.0.1
      DST_DB_PORT: 3306
      DST_DB_USER: root
      DST_DB_PASSWORD: ''
      DST_DB_NAME: dup_dst

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Create Test Databases
        run: mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS dup_src; CREATE DATABASE IF NOT EXISTS dup_dst;"

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build
