# DEP-16: weekly update PRs for npm packages and GitHub Actions. Minor and patch updates come grouped in one PR;
# majors that need their own migration are skipped (security fixes still arrive as their own PRs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: knex
        update-types: [version-update:semver-major]
      - dependency-name: '@types/express'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
